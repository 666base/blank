[package]
authors     = ["Blank"]
description = "Blank desktop (Tauri)"
edition     = "2021"
name        = "blank"
version     = "0.27.0"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name       = "blank_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tauri              = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
codegen-units = 1
lto           = true
panic         = "abort"
